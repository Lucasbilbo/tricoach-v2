[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  ignore = "git diff --quiet HEAD^ HEAD -- . ':(exclude)push-subscription.json' ':(exclude)history.json'"

# ── App React (SPA fallback) ──────────────────────────────────────────────────
[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# ── Bloquear archivos sensibles ───────────────────────────────────────────────
[[redirects]]
  from = "/history.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/push-subscription.json"
  to = "/404"
  status = 404
  force = true

# ── Security headers para toda la app ────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(*), camera=(), geolocation=()"

# ── CORS de las functions ────────────────────────────────────────────────────
# Lo gestiona cada function con netlify/functions/lib/auth.js (corsHeaders):
# solo getricoach.com, tricoach-v2.netlify.app, sus deploy previews y localhost.
# Antes era "*" a nivel de sitio.

# ── Health-check diario del coach (nov-2026) ─────────────────────────────────
# Prueba los modelos de Claude configurados y avisa a ALERT_EMAIL si fallan.
[functions."health-check"]
  schedule = "13 7 * * *"

# ── Crons de usuario (reactivados 12-nov-2026) ───────────────────────────────
# Todos exigen CRONS_ENABLED=true en Netlify (lib/auth.js guardScheduled) y solo
# envían email si EMAILS_ENABLED=true.
# Plan semanal automático: lunes 03:00 UTC (fuera de la ventana DST). Pro y prueba Pro.
[functions."auto-plans"]
  schedule = "0 3 * * 1"

# Aviso de fin de prueba Pro: un email por cuenta, 2 días antes de caducar.
[functions."trial-reminder"]
  schedule = "23 8 * * *"

# Email ÚNICO de recuperación a las altas sin plan: 13-nov-2026, 09:30 y 10:30 UTC.
# La función caduca sola el 20-nov-2026; después se pueden borrar ella y este bloque.
[functions."recuperacion-altas"]
  schedule = "30 9,10 13 11 *"

# Revisión semanal por email: domingos 19:00 UTC. Solo Pro y prueba Pro.
[functions."weekly-report"]
  schedule = "0 19 * * 0"

# Recordatorio el día de la sesión: todos los días 18:30 UTC (19:30/20:30 en Madrid). Free y Pro.
# Un email por cuenta y día (profiles.recordatorio_enviado_el, migración 009). Con EMAILS_ENABLED=false no hace nada.
[functions."session-reminder"]
  schedule = "30 18 * * *"

# Sigue PAUSADO (para reactivar, restaurar este bloque):
#   [functions."thursday-reminder"] schedule = "0 17 * * 4"   (jueves 17:00 UTC)
