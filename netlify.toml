[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  ignore = "git diff --quiet HEAD^ HEAD -- . ':(exclude)push-subscription.json' ':(exclude)history.json'"

# ── App React (SPA fallback) ──────────────────────────────────────────────────
[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# ── Bloquear archivos sensibles ───────────────────────────────────────────────
[[redirects]]
  from = "/history.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/push-subscription.json"
  to = "/404"
  status = 404
  force = true

# ── Security headers para toda la app ────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(*)"

# ── CORS solo para las functions (no para archivos estáticos) ────────────────
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, x-tricoach-secret"
    Access-Control-Allow-Methods = "GET, POST, DELETE, OPTIONS"

[functions."push-send"]
  schedule = "0 7,19 * * *"

[functions."weekly-report"]
  schedule = "0 19 * * 0"
# ── Páginas SEO ──────────────────────────────────────────────────────────────
[[redirects]]
  from = "/entrenamiento-zona-2"
  to = "/entrenamiento-zona-2.html"
  status = 200

[[redirects]]
  from = "/plan-media-maraton"
  to = "/plan-media-maraton.html"
  status = 200

[[redirects]]
  from = "/preparar-primer-triatlon"
  to = "/preparar-primer-triatlon.html"
  status = 200

[[redirects]]
  from = "/plan-entrenamiento-triatlon"
  to = "/plan-entrenamiento-triatlon.html"
  status = 200

[[redirects]]
  from = "/plan-entrenamiento-hyrox"
  to = "/plan-entrenamiento-hyrox.html"
  status = 200
  
[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  publish = "dist"