[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  ignore = "git diff --quiet HEAD^ HEAD -- . ':(exclude)push-subscription.json' ':(exclude)history.json'"

# ── App React (SPA fallback) ──────────────────────────────────────────────────
[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# ── Bloquear archivos sensibles ───────────────────────────────────────────────
[[redirects]]
  from = "/history.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/push-subscription.json"
  to = "/404"
  status = 404
  force = true

# ── Security headers para toda la app ────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(*), camera=(), geolocation=()"

# ── CORS solo para las functions (no para archivos estáticos) ────────────────
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, x-tricoach-secret"
    Access-Control-Allow-Methods = "GET, POST, DELETE, OPTIONS"

# PAUSA (29-oct-2026): crons desactivados. Para reactivar, restaurar estos 3 bloques:
#   [functions."weekly-report"]    schedule = "0 19 * * 0"   (domingos 19:00 UTC)
